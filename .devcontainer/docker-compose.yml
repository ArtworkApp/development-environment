services:
  workspace:
    image: devcontainer-workspace:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - be_nestjs_node_modules:/workspace/be-nestjs/node_modules
    command: /bin/sh -c "while sleep 1000; do :; done"
    ports:
      - "3001:3001"
    networks:
      - artwork-app-network
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: artwork_db_user
      POSTGRES_PASSWORD: artwork_db_password
      POSTGRES_DB: artwork_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - artwork-app-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_root_username
      MINIO_ROOT_PASSWORD: minio_root_secret_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - artwork-app-network

networks:
  artwork-app-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  be_nestjs_node_modules:
